# fly.toml app configuration file generated for sa-online-browser on 2026-09-20T15:07:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sa-online-browser'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'server'

[env]
  POC_HOST = '0.0.0.0'
  POC_SCENE = 'neighborhood'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 8
    soft_limit = 8

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
